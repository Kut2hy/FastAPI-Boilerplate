[project]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kut2hy", email = "vojtakuthan@seznam.cz" }
]
requires-python = ">=3.14.5"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosmtplib>=5.1.2",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.141.1",
    "httptools>=0.8.0",
    "jinjax>=0.65",
    "piccolo[all]>=1.36.0",
    "pyjwt>=2.13.0",
    "pytest-redis>=4.0.0",
    "redis[hiredis]>=8.1.0",
    "slowapi>=0.1.10",
    "uvloop>=0.22.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
src = ["app", ]

[tool.ruff.lint]
# Enable recommended rules plus additional useful ones
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "G",      # flake8-logging-format
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules

    # EXTRA STUFF
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "FIX",    # flake8-fixme
    "LOG",    # flake8-logging
    "PYI",    # flake8-pyi
    "SLF",    # flake8-self
    "TC" ,    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PERF",   # Perflint
    "D",      # pydocstyle
]

# Ignore specific rules that might be too strict
ignore = [
    "D202",    # No blank lines allowed after function docstring
    "TRY003",  # avoid specifying long messages outside exception class
    "TRY301",  # raise-within-try
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "UP017",   # Ruff suggest non-existing object
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when they start with underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in test files
"**/test_*.py" = ["ARG", "PLR2004", "S101"]
"**/unittest_*.py" = ["ARG", "PLR2004", "PT009", "PT027", "ANN202"]
"**/__init__.py" = ["F401", "D104"]  # Allow unused imports in __init__.py

[tool.ruff.lint.flake8-type-checking]
# Base classes whose subclasses need annotations available at runtime (e.g. Pydantic
# builds its validation schema from them). Prevents TC001/TC002/TC003 from moving these
# imports into `TYPE_CHECKING` blocks, which would break model construction at runtime.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "app.core.common.pydantic_classes.model.InputModel",
]

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["app", "common"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pylint]
# Configure pylint rules
max-args = 10
max-branches = 15

[tool.ruff.format]
# Use double quotes by default
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Use `\n` line endings for all files
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings
docstring-code-format = true

# Set the line length limit used when formatting code snippets in docstrings
docstring-code-line-length = "dynamic"
