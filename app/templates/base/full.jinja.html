<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="htmx-config" content='{"transitions": true, "history": true}'>

        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta6/dist/htmx.min.js" nonce="{{ nonce_hash }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta6/dist/ext/hx-csp.js" nonce="{{ nonce_hash }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta6/dist/ext/hx-alpine-compat.js" nonce="{{ nonce_hash }}"></script>

        <title>{{ title or _("Untitled") }}</title>
    </head>

    <body id="{{ get_hx_id('body') }}">
        {%- include fragments["body"].path %}
    </body>

</html>
