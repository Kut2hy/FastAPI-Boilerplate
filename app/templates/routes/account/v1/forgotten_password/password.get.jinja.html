<Card title={{ _("Reset Password") }} description={{ _("Enter your new password with confirmation.") }}>
    <SimpleForm href="/account/v1/forgotten-password/password" target={{ get_hx_target('main') }} nonce_hash={{ nonce_hash }} submit_text={{ _('Submit') }} reset_text={{ _('Reset') }}>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
    </SimpleForm>
</Card>
